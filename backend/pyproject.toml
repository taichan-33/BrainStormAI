[tool.poetry]
name = "brainstorm-ai-backend"
version = "0.1.0"
package-mode = false
description = "Backend for AI Brainstorming Platform"
authors = ["Admin <admin@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
langchain = "^0.1.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"
openai = "^1.12.0"
google-generativeai = "^0.3.2"
# openai = "^1.0.0" 
# google-generativeai = "^0.3.0" 

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.26.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
